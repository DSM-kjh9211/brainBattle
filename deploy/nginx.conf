upstream battle {
  # route every connection of a session to the same node (the lease owner)
  hash $arg_sid consistent;
  server battle-1:4000 max_fails=2 fail_timeout=5s;
  server battle-2:4000 max_fails=2 fail_timeout=5s;
}
server {
  listen 80;
  location /ws {
    proxy_pass http://battle;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
  location / {
    proxy_pass http://battle;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
