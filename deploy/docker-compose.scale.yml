# Horizontal scaling example: 2 battle nodes behind nginx, one PostgreSQL.
#   docker compose -f deploy/docker-compose.scale.yml up -d --build
# Each live session is owned by exactly one node (session_leases). nginx hashes WebSocket
# connections by ?sid= so all clients of a session reach the owner; misrouted first joins are
# redirected by the server (SESSION_OWNED_ELSEWHERE + ownerUrl). If a node dies, its leases expire
# and the other node recovers the sessions from PostgreSQL.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: brainbattle, POSTGRES_USER: brainbattle, POSTGRES_PASSWORD: brainbattle }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U brainbattle"], interval: 5s, retries: 10 }
  battle-1: &battle
    build: ..
    depends_on: { postgres: { condition: service_healthy } }
    environment: &env
      DATABASE_URL: postgres://brainbattle:brainbattle@postgres:5432/brainbattle
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: http://localhost:8080
      NODE_ID: battle-1
      NODE_PUBLIC_URL: http://localhost:8081
    ports: ["8081:4000"]
  battle-2:
    <<: *battle
    environment:
      <<: *env
      NODE_ID: battle-2
      NODE_PUBLIC_URL: http://localhost:8082
    ports: ["8082:4000"]
  lb:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:80"]
    depends_on: [battle-1, battle-2]
