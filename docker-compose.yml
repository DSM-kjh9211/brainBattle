# Single battle server + PostgreSQL (typical school deployment).
#   docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brainbattle
      POSTGRES_USER: brainbattle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainbattle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainbattle"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://brainbattle:${POSTGRES_PASSWORD:-brainbattle}@postgres:5432/brainbattle
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 chars) in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      ALLOW_TEACHER_SIGNUP: ${ALLOW_TEACHER_SIGNUP:-true}
      NODE_ID: battle-1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  pgdata:
